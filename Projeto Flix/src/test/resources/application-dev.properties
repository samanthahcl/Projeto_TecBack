spring.application.name=techback

# mensagens de erro detalhadas
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# H2 Console - acessar em http://localhost:8080/h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Banco H2 em modo compatível com PostgreSQL
spring.datasource.url=jdbc:h2:file:~/teckback20262;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# deixar o Flyway controlar o schema
spring.jpa.hibernate.ddl-auto=validate

# Flyway - lê os scripts de src/main/resources/db/migration/
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# mostrar SQL no console
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger - acessar em http://localhost:8080/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ViaCEP
viacep.url=https://viacep.com.br/ws
